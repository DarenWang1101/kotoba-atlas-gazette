name: Publish The Kotoba Gazette
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract source package
        run: unzip -q gazette-source.zip
      - name: Check atlas behavior and data
        run: |
          node --check dist/app.js
          node tests/history.cjs
          node tests/textbooks.cjs
          node tests/cluster-core.cjs
          node tests/ui-smoke.cjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare deployment copy
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-pages.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
